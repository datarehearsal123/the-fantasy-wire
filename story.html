<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story | The Fantasy Wire</title><style>:root{--navy:#111d2a;--green:#b7f05a}*{box-sizing:border-box}body{margin:0;background:#f3f4f1;color:#17202a;font:17px/1.75 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--navy);color:white;padding:22px max(22px,calc((100vw - 1100px)/2))}header a{color:inherit;text-decoration:none}.logo{font-weight:950;font-size:clamp(26px,4vw,42px);letter-spacing:-1.5px}.logo span{color:var(--green)}nav{font-size:13px;margin-top:8px;color:#b9c5c9}.wrap{max-width:840px;margin:35px auto 70px;padding:0 22px}article{background:white;padding:clamp(22px,5vw,58px);border:1px solid #dce0de}.kicker{color:#5d822b;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:1.4px}h1{font-size:clamp(34px,5vw,57px);line-height:1.09;letter-spacing:-1.5px;margin:12px 0 20px}.dek{font-size:21px;color:#55616d;line-height:1.4}.meta{font-size:12px;color:#687681;border-top:1px solid #e1e4e3;border-bottom:1px solid #e1e4e3;padding:12px 0;margin:25px 0}p{margin:0 0 22px}.back{font-size:14px;font-weight:800;color:#334b18;text-decoration:none}.note{background:#f1f5e9;padding:15px;font-size:13px;color:#4e5d45;margin-top:24px}footer{background:var(--navy);color:#bfc7cc;text-align:center;padding:28px;font-size:12px}</style></head><body><header><a href="./"><div class="logo">THE FANTASY <span>WIRE.</span></div><nav>← Back to the newsroom</nav></a></header><main class="wrap"><article id="content"><p>Loading story…</p></article><p><a class="back" href="./">← Back to all league news</a></p></main><footer>© The Fantasy Wire · Independent fantasy league coverage · Not affiliated with Fantrax or the NHL.</footer><script>const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function start(){const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('./stories.json');if(!r.ok)throw Error('Stories unavailable');const all=await r.json();const s=all.find(x=>x.id===id);if(!s)throw Error('Story not found');document.title=s.title+' | The Fantasy Wire';document.getElementById('content').innerHTML=`<div class="kicker">${safe(s.category)}</div><h1>${safe(s.title)}</h1><p class="dek">${safe(s.dek)}</p><div class="meta">${safe(s.date)} · ${safe(s.status)} · The Fantasy Wire</div>${s.paragraphs.map(p=>`<p>${safe(p)}</p>`).join('')}<div class="note">Historical analysis based on an initial Fantrax standings export. Not a live scoring report. Humorous commentary is satire, not a claim about actual manager statements or conduct.</div>`}catch(e){document.getElementById('content').textContent=e.message}}start();</script></body></html>
